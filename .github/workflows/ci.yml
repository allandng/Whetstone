name: CI

# Run on pushes to main and on pull requests. Without the branch filter a PR
# from an in-repo branch triggers every job twice (once for push, once for the
# PR); this runs each change once.
on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token; this workflow only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a rapid push sequence doesn't queue
# redundant builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend (editable, with dev extras, pinned)
        # -c constraints.txt pins transitive versions so CI is reproducible.
        run: pip install -e ".[dev]" -c constraints.txt
      - name: Run pytest
        run: pytest -q

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      # Node 24 matches local dev and satisfies Vite 7 / Vitest 4's engine floor.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  psirver:
    name: Psirver (build + integration test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/psirver/src
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        # clang++ is what Psirver execs to compile C++ jobs; netcat/lsof/python3
        # are used by the integration harness (test.sh).
        run: sudo apt-get update && sudo apt-get install -y clang netcat-openbsd lsof python3
      - name: Build psirver
        run: make
      - name: Integration test
        run: make test
